<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parametric Maker Forge - 3D Canvas Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 340px; background: #1e293b; border-right: 1px solid #334155; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    #viewport { flex: 1; position: relative; }
    h1 { font-size: 1.1rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; letter-spacing: 0.05em; }
    select, input[type="text"], input[type="number"] { background: #1e293b; border: 1px solid #475569; color: #f8fafc; border-radius: 6px; padding: 8px; font-size: 0.85rem; width: 100%; }
    .slider-group { display: flex; flex-direction: column; gap: 4px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.8rem; }
    input[type="range"] { accent-color: #38bdf8; width: 100%; }
    .btn { background: #0284c7; color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 600; cursor: pointer; transition: background 0.15s; font-size: 0.85rem; }
    .btn:hover { background: #0369a1; }
    #toast { position: absolute; bottom: 20px; right: 20px; background: #10b981; color: white; padding: 10px 16px; border-radius: 6px; font-size: 0.85rem; display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="sidebar">
    <h1>⚙️ Maker Forge 3D</h1>

    <div class="card">
      <label>1. Device / Part ID Preset</label>
      <select id="boardPreset">
        <option value="ESP32-DEV-38P">ESP32 WROOM-32 (38-Pin DevKit)</option>
        <option value="RPI-5-B">Raspberry Pi 5 (85x56mm)</option>
        <option value="RPI-ZERO-2W">Raspberry Pi Zero 2 W</option>
        <option value="ARD-UNO-R3">Arduino Uno R3 / R4</option>
        <option value="CUSTOM">Custom Dimensions</option>
      </select>
    </div>

    <div class="card">
      <label>2. Physical Part ID Debossing</label>
      <input type="text" id="partIdText" value="ESP32-DEV-38P">
    </div>

    <div class="card">
      <label>3. Fastener Mechanism</label>
      <select id="fastenerType">
        <option value="HEATSET_M3">M3 Brass Heat-Set Inserts (Ruthex)</option>
        <option value="SNAP_FIT">Pure Snap-Fit (Perimeter Lip)</option>
      </select>
    </div>

    <div class="card">
      <label>4. Parametric Sliders</label>
      <div class="slider-group">
        <div class="slider-header"><span>Length (mm)</span><span id="valL">65</span></div>
        <input type="range" id="sliderL" min="30" max="140" value="65">
      </div>
      <div class="slider-group">
        <div class="slider-header"><span>Width (mm)</span><span id="valW">38</span></div>
        <input type="range" id="sliderW" min="20" max="90" value="38">
      </div>
      <div class="slider-group">
        <div class="slider-header"><span>Height (mm)</span><span id="valH">22</span></div>
        <input type="range" id="sliderH" min="12" max="60" value="22">
      </div>
      <div class="slider-group">
        <div class="slider-header"><span>Exploded View</span><span id="valExplode">15mm</span></div>
        <input type="range" id="sliderExplode" min="0" max="50" value="15">
      </div>
    </div>

    <button class="btn" id="btnCopy">📋 Copy Parametric OpenSCAD</button>
  </div>

  <div id="viewport">
    <div id="toast">Copied OpenSCAD Code to Clipboard!</div>
  </div>

  <script>
    const presets = {
      "ESP32-DEV-38P": { l: 65, w: 38, h: 22, label: "ESP32-DEV-38P" },
      "RPI-5-B":       { l: 95, w: 66, h: 32, label: "RPI-5-B" },
      "RPI-ZERO-2W":   { l: 74, w: 38, h: 18, label: "RPI-ZERO-2W" },
      "ARD-UNO-R3":    { l: 80, w: 64, h: 28, label: "ARD-UNO-R3" },
      "CUSTOM":        { l: 70, w: 50, h: 25, label: "CUSTOM-DEVICE" }
    };

    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(100, 100, 120);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambLight);
    const dirLight = new THREE.DirectionalLight(0x38bdf8, 0.8);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(200, 20, 0x334155, 0x1e293b);
    grid.position.y = -0.1;
    scene.add(grid);

    let baseMesh, lidMesh;
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3, metalness: 0.1 });
    const lidMat  = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.4, transparent: true, opacity: 0.85 });

    function rebuildMeshes() {
      if (baseMesh) scene.remove(baseMesh);
      if (lidMesh)  scene.remove(lidMesh);

      const l = parseFloat(document.getElementById('sliderL').value);
      const w = parseFloat(document.getElementById('sliderW').value);
      const h = parseFloat(document.getElementById('sliderH').value);
      const explode = parseFloat(document.getElementById('sliderExplode').value);

      const baseH = h * 0.65;
      const lidH  = h * 0.35;

      const baseGeo = new THREE.BoxGeometry(l, baseH, w);
      baseMesh = new THREE.Mesh(baseGeo, baseMat);
      baseMesh.position.set(0, baseH / 2, 0);
      scene.add(baseMesh);

      const lidGeo = new THREE.BoxGeometry(l, lidH, w);
      lidMesh = new THREE.Mesh(lidGeo, lidMat);
      lidMesh.position.set(0, baseH + lidH / 2 + explode, 0);
      scene.add(lidMesh);
    }

    rebuildMeshes();

    // Orbit controls simulation
    let isDragging = false, prevMouseX = 0, prevMouseY = 0;
    container.addEventListener('mousedown', e => { isDragging = true; prevMouseX = e.clientX; prevMouseY = e.clientY; });
    window.addEventListener('mouseup', () => isDragging = false);
    container.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.clientX - prevMouseX;
      const dy = e.clientY - prevMouseY;
      scene.rotation.y += dx * 0.01;
      scene.rotation.x += dy * 0.01;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    function animate() {
      requestAnimationFrame(animate);
      camera.lookAt(0, 15, 0);
      renderer.render(scene, camera);
    }
    animate();

    // Event listeners
    ['sliderL', 'sliderW', 'sliderH', 'sliderExplode'].forEach(id => {
      document.getElementById(id).addEventListener('input', e => {
        document.getElementById('val' + id.replace('slider', '')).innerText = e.target.value;
        rebuildMeshes();
      });
    });

    document.getElementById('boardPreset').addEventListener('change', e => {
      const p = presets[e.target.value];
      if (p) {
        document.getElementById('sliderL').value = p.l;
        document.getElementById('sliderW').value = p.w;
        document.getElementById('sliderH').value = p.h;
        document.getElementById('partIdText').value = p.label;
        document.getElementById('valL').innerText = p.l;
        document.getElementById('valW').innerText = p.w;
        document.getElementById('valH').innerText = p.h;
        rebuildMeshes();
      }
    });

    document.getElementById('btnCopy').addEventListener('click', () => {
      const l = document.getElementById('sliderL').value;
      const w = document.getElementById('sliderW').value;
      const h = document.getElementById('sliderH').value;
      const partId = document.getElementById('partIdText').value;
      const fastener = document.getElementById('fastenerType').value;

      const code = `// Parametric Maker Forge Export\nPart_ID_Label = "${partId}";\nInternal_Length = ${l};\nInternal_Width = ${w};\nInternal_Height = ${h};\nFastener_Style = "${fastener}";\ninclude <engines/enclosure_engine.scad>;`;
      navigator.clipboard.writeText(code);
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 2500);
    });
  </script>
</body>
</html>
